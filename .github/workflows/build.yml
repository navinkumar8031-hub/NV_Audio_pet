name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Files
        run: |
          flutter create --platforms=android --org com.nvstudio --project-name nv_audio_pet .

      - name: Configure Android, Permissions & Fix Plugin compileSdkVersion
        run: |
          # 1. Update Kotlin version
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/g' android/build.gradle
          fi

          # 2. Inject Bluetooth & Location Permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<manifest [^>]*>/&\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>/' $MANIFEST

          # 3. Explicitly set compileSdk 34 and minSdk 21 in app build.gradle
          APP_GRADLE="android/app/build.gradle"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34\n        compileSdkVersion 34/g' $APP_GRADLE || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' $APP_GRADLE || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' $APP_GRADLE || true

          # 4. Global properties for Android build tools
          echo "compileSdkVersion=34" >> android/gradle.properties
          echo "targetSdkVersion=34" >> android/gradle.properties
          echo "minSdkVersion=21" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.minSdkVersion=21" >> android/gradle.properties
          echo "flutter.targetSdkVersion=34" >> android/gradle.properties

          # 5. Fix plugins compileSdkVersion without touching already evaluated :app
          cat << 'EOF' >> android/build.gradle

          allprojects {
              ext {
                  compileSdkVersion = 34
                  targetSdkVersion = 34
                  minSdkVersion = 21
              }
          }

          subprojects { subproject ->
              if (subproject.name != "app") {
                  subproject.plugins.withId("com.android.library") {
                      subproject.android {
                          compileSdkVersion 34
                      }
                  }
                  if (!subproject.state.executed) {
                      subproject.afterEvaluate {
                          if (subproject.hasProperty("android")) {
                              subproject.android {
                                  compileSdkVersion 34
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-Studio-DSP-Release
          path: build/app/outputs/flutter-apk/app-release.apk
