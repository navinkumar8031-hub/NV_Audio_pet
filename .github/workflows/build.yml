name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Files
        run: |
          flutter create --platforms=android --org com.nvstudio --project-name nv_audio_pet .

      - name: Upgrade Kotlin & Inject Internet Permissions
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.0"/g' android/build.gradle
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # 1. Add Internet and Network State permissions
          sed -i 's/<manifest [^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>/' $MANIFEST
          
          # 2. Allow ws:// HTTP Cleartext on Local ESP32 Network
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NV-Studio-DSP-Release
          path: build/app/outputs/flutter-apk/app-release.apk
